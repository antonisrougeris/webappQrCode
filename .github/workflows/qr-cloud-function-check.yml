name: QR Cloud Function Check

on:
  pull_request:
    paths:
      - 'firebase/functions/**'
      - 'firebase/firebase.json'
      - '.github/workflows/qr-cloud-function-check.yml'
  push:
    branches:
      - 'feature/dynamic-qr-photo-destinations-20261010'
    paths:
      - 'firebase/functions/**'
      - 'firebase/firebase.json'
      - '.github/workflows/qr-cloud-function-check.yml'

permissions:
  contents: read

jobs:
  test:
    name: QR Redirect Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check index.js

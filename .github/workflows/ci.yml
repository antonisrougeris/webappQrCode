name: SKANARE CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3220089_3220172/partb/client

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3220089_3220172/partb/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_QR_REDIRECT_BASE_URL: ${{ vars.VITE_QR_REDIRECT_BASE_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: skanare-frontend
          path: 3220089_3220172/partb/client/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3220089_3220172/partb/server

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3220089_3220172/partb/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: node --check src/app.js

      - name: Validate dependency tree
        run: npm ls --omit=dev

  ssh-test:
    name: Production SSH Test
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    # Do not expose production credentials to pull_request runs
    if: github.event_name != 'pull_request'

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SKANARE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SKANARE_SSH_HOST }}
          SSH_PORT: ${{ secrets.SKANARE_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/skanare_deploy
          chmod 600 ~/.ssh/skanare_deploy

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test production SSH connection
        env:
          SSH_HOST: ${{ secrets.SKANARE_SSH_HOST }}
          SSH_USER: ${{ secrets.SKANARE_SSH_USER }}
          SSH_PORT: ${{ secrets.SKANARE_SSH_PORT }}
        run: |
          ssh \
            -i ~/.ssh/skanare_deploy \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connection successful"; whoami; hostname'
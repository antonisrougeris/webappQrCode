name: SKANARE CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3220089_3220172/partb/client

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3220089_3220172/partb/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: skanare-frontend
          path: 3220089_3220172/partb/client/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3220089_3220172/partb/server

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3220089_3220172/partb/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: node --check src/app.js

      - name: Validate dependency tree
        run: npm ls --omit=dev
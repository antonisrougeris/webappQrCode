name: SKANARE CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3220089_3220172/partb/client

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3220089_3220172/partb/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production frontend configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_QR_REDIRECT_BASE_URL: ${{ vars.VITE_QR_REDIRECT_BASE_URL }}
        run: |
          test -n "$VITE_API_BASE_URL" || {
            echo "ERROR: VITE_API_BASE_URL is missing"
            exit 1
          }

          test "$VITE_API_BASE_URL" = "https://skanare.com/api" || {
            echo "ERROR: VITE_API_BASE_URL is not the production API"
            exit 1
          }

          test -n "$VITE_QR_REDIRECT_BASE_URL" || {
            echo "ERROR: VITE_QR_REDIRECT_BASE_URL is missing"
            exit 1
          }

          echo "Production frontend configuration OK"

      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_QR_REDIRECT_BASE_URL: ${{ vars.VITE_QR_REDIRECT_BASE_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

      - name: Verify SEO product prerendering
        run: |
          grep -q 'data-prerendered-product="true"' dist/index.html || {
            echo "ERROR: homepage product cards were not prerendered"
            exit 1
          }

          grep -q 'data-prerender="homepage-products"' dist/index.html || {
            echo "ERROR: homepage product ItemList JSON-LD is missing"
            exit 1
          }

          grep -q 'data-prerendered-product="true"' dist/src/pages/products/products.html || {
            echo "ERROR: products page cards were not prerendered"
            exit 1
          }

          grep -q 'data-prerender="products-page"' dist/src/pages/products/products.html || {
            echo "ERROR: products page ItemList JSON-LD is missing"
            exit 1
          }

          grep -q 'SKANARE_LIVE:GRID:featuredTshirtsGrid:START' dist/index.html || {
            echo "ERROR: homepage live-refresh markers are missing"
            exit 1
          }

          grep -q 'SKANARE_LIVE:GRID:productsGrid:START' dist/src/pages/products/products.html || {
            echo "ERROR: products-page live-refresh markers are missing"
            exit 1
          }

          test -f dist/el/index.html || {
            echo "ERROR: Greek homepage was not built"
            exit 1
          }

          test -f dist/el/products/index.html || {
            echo "ERROR: Greek products page was not built"
            exit 1
          }

          test -f dist/el/_templates/product-details.html || {
            echo "ERROR: Greek product detail template was not built"
            exit 1
          }

          grep -q 'lang="el"' dist/el/index.html || {
            echo "ERROR: Greek homepage language metadata is missing"
            exit 1
          }

          grep -q 'hreflang="el"' dist/el/index.html || {
            echo "ERROR: Greek homepage hreflang is missing"
            exit 1
          }

          grep -q 'SKANARE_LIVE:GRID:featuredTshirtsGrid:START' dist/el/index.html || {
            echo "ERROR: Greek homepage live-refresh markers are missing"
            exit 1
          }

          grep -q 'SKANARE_LIVE:GRID:productsGrid:START' dist/el/products/index.html || {
            echo "ERROR: Greek products live-refresh markers are missing"
            exit 1
          }

          grep -q 'Ανακάλυψε προϊόντα QR' dist/el/products/index.html || {
            echo "ERROR: curated Greek product-page copy is missing"
            exit 1
          }

          test -f dist/el/src/pages/checkout/checkout.html || {
            echo "ERROR: legacy Greek preview alias for checkout is missing"
            exit 1
          }

          test -f dist/el/src/pages/shipping-policy/shipping-policy.html || {
            echo "ERROR: legacy Greek preview alias for shipping policy is missing"
            exit 1
          }

          if grep -R 'href="/el/assets' dist/el --include='*.html' || grep -R "href='/el/assets" dist/el --include='*.html'; then
            echo "ERROR: Greek pages contain broken localized asset URLs"
            exit 1
          fi

          grep -q 'href="/assets/' dist/el/index.html || {
            echo "ERROR: Greek homepage is not referencing shared root assets"
            exit 1
          }

          grep -Fq 'href="/product/' dist/el/index.html || {
            echo "ERROR: Greek homepage product links are missing"
            exit 1
          }

          grep -Fq '?lang=el' dist/el/index.html || {
            echo "ERROR: Greek homepage product links are missing the Greek locale"
            exit 1
          }

          if grep -R 'href="/el/product/' dist/el --include='*.html'; then
            echo "ERROR: broken /el/product links were generated"
            exit 1
          fi

          grep -q 'components.css?v=2.9-i18n-fixes' dist/el/index.html || {
            echo "ERROR: shared CSS cache-buster was not refreshed"
            exit 1
          }

          grep -q 'registerLink.href = localizedPath' src/pages/login/login.ts || {
            echo "ERROR: login -> register can drop the active locale"
            exit 1
          }

          grep -q 'forgotPasswordLink.href =' src/pages/login/login.ts &&
          grep -q 'localizedPath(' src/pages/login/login.ts || {
            echo "ERROR: login -> forgot-password can drop the active locale"
            exit 1
          }

          grep -q 'window.location.href = localizedPath' src/pages/register/register.ts || {
            echo "ERROR: register flow can drop the active locale"
            exit 1
          }

          grep -q 'window.location.href = localizedPath' src/pages/verify-email/verify-email.ts || {
            echo "ERROR: verify-email flow can drop the active locale"
            exit 1
          }

          echo "SEO prerendering + English/Greek localization markers, routing, auth flow and asset paths OK"

      - name: Guard production bundle against development URLs
        run: |
          if grep -R -n -E 'csb\\.app|localhost:[0-9]+|127\\.0\\.0\\.1:[0-9]+' dist; then
            echo "ERROR: development URL found in production frontend bundle"
            exit 1
          fi

          grep -R -q 'https://skanare.com/api' dist || {
            echo "ERROR: production API URL not found in frontend bundle"
            exit 1
          }

          echo "Production frontend bundle guard OK"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: skanare-frontend
          path: 3220089_3220172/partb/client/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3220089_3220172/partb/server

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3220089_3220172/partb/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: |
          find src scripts -type f -name '*.js' -print0             | xargs -0 -n1 node --check

      - name: Validate dependency tree
        run: npm ls --omit=dev

      - name: Run backend tests
        run: npm test

      - name: Audit backend dependencies
        run: npm audit --omit=dev --audit-level=critical
    
      - name: Prepare backend artifact
        run: |
          rm -rf deploy-package
          mkdir deploy-package

          cp -a src deploy-package/
          cp -a scripts deploy-package/
          cp -a assets deploy-package/
          cp -a fonts deploy-package/
          cp package.json package-lock.json deploy-package/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: skanare-backend
          path: 3220089_3220172/partb/server/deploy-package/
          if-no-files-found: error
          retention-days: 7


  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    # Production deploy only for pushes to main.
    # Never deploy pull_request runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: skanare-frontend
          path: deploy/client/dist

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: skanare-backend
          path: deploy/server

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SKANARE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SKANARE_SSH_HOST }}
          SSH_PORT: ${{ secrets.SKANARE_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/skanare_deploy
          chmod 600 ~/.ssh/skanare_deploy

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create release on server
        env:
          SSH_HOST: ${{ secrets.SKANARE_SSH_HOST }}
          SSH_USER: ${{ secrets.SKANARE_SSH_USER }}
          SSH_PORT: ${{ secrets.SKANARE_SSH_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/skanare_deploy \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "rm -rf /srv/skanare/releases/$RELEASE_SHA &&
               mkdir -p /srv/skanare/releases/$RELEASE_SHA/client/dist &&
               mkdir -p /srv/skanare/releases/$RELEASE_SHA/server"

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.SKANARE_SSH_HOST }}
          SSH_USER: ${{ secrets.SKANARE_SSH_USER }}
          SSH_PORT: ${{ secrets.SKANARE_SSH_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/skanare_deploy \
              -P "$SSH_PORT" \
              -r deploy/client/dist/. \
              "$SSH_USER@$SSH_HOST:/srv/skanare/releases/$RELEASE_SHA/client/dist/"

          scp -i ~/.ssh/skanare_deploy \
              -P "$SSH_PORT" \
              -r deploy/server/. \
              "$SSH_USER@$SSH_HOST:/srv/skanare/releases/$RELEASE_SHA/server/"

      - name: Install production dependencies
        env:
          SSH_HOST: ${{ secrets.SKANARE_SSH_HOST }}
          SSH_USER: ${{ secrets.SKANARE_SSH_USER }}
          SSH_PORT: ${{ secrets.SKANARE_SSH_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/skanare_deploy \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "cd /srv/skanare/releases/$RELEASE_SHA/server &&
               npm ci --omit=dev"

      - name: Activate release and health check
        env:
          SSH_HOST: ${{ secrets.SKANARE_SSH_HOST }}
          SSH_USER: ${{ secrets.SKANARE_SSH_USER }}
          SSH_PORT: ${{ secrets.SKANARE_SSH_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/skanare_deploy \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          NEW_RELEASE="/srv/skanare/releases/$RELEASE_SHA"
          PREVIOUS_RELEASE="$(readlink -f /srv/skanare/current || true)"

          echo "Previous release: $PREVIOUS_RELEASE"
          echo "New release:      $NEW_RELEASE"

          # Persistent production data
          ln -sfn /srv/skanare/shared/server.env \
            "$NEW_RELEASE/server/.env"

          rm -rf "$NEW_RELEASE/server/exports"
          ln -s /srv/skanare/shared/exports \
            "$NEW_RELEASE/server/exports"

          # Validate release before switching
          test -f "$NEW_RELEASE/client/dist/index.html"
          test -f "$NEW_RELEASE/server/src/app.js"
          test -f "$NEW_RELEASE/server/package.json"
          test -r "$NEW_RELEASE/server/.env"

          # Atomic application release switch
          ln -sfn "$NEW_RELEASE" /srv/skanare/current

          # PM2 follows /srv/skanare/current/server
          pm2 restart skanare-api

          HEALTHY=0

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4000/api/health/ready >/dev/null; then
              HEALTHY=1
              break
            fi

            echo "Health check attempt $attempt failed..."
            sleep 2
          done

          rollback() {
            if [ -n "$PREVIOUS_RELEASE" ] &&
               [ -d "$PREVIOUS_RELEASE" ]; then
              echo "Rolling back to $PREVIOUS_RELEASE"

              ln -sfn "$PREVIOUS_RELEASE" /srv/skanare/current
              pm2 restart skanare-api

              for attempt in 1 2 3 4 5 6; do
                if curl --fail --silent --show-error \
                  http://127.0.0.1:4000/api/health/ready >/dev/null; then
                  echo "Rollback successful."
                  return 0
                fi

                sleep 2
              done

              echo "Rollback health check failed."
              return 1
            fi

            echo "No previous release is available for rollback."
            return 1
          }

          if [ "$HEALTHY" -ne 1 ]; then
            echo "New release failed readiness check."
            rollback || true
            exit 1
          fi

          # Public smoke checks. Any failure rolls the release back.
          if ! curl --fail --silent --show-error \
            https://skanare.com/ >/dev/null ||
             ! curl --fail --silent --show-error \
            https://skanare.com/login >/dev/null ||
             ! curl --fail --silent --show-error \
            https://skanare.com/products >/dev/null ||
             ! curl --fail --silent --show-error \
            https://skanare.com/api/health/ready >/dev/null; then
            echo "Public smoke checks failed."
            rollback || true
            exit 1
          fi

          # Keep a small bounded release history.
          find /srv/skanare/releases \
            -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | while read -r old_release; do
                if [ "$old_release" != "$(readlink -f /srv/skanare/current)" ] &&
                   [ "$old_release" != "$PREVIOUS_RELEASE" ]; then
                  rm -rf "$old_release"
                fi
              done

          pm2 save

          echo "Deployment successful: $RELEASE_SHA"
          REMOTE
  <line x1="54" y1="1020" x2="1066" y2="1020" stroke="#ddd"/><line x1="54" y1="1127" x2="1066" y2="1127" stroke="#ddd"/>
  <g font-size="30" font-weight="800" text-anchor="middle"><text x="152" y="985">Size</text><text x="331" y="985">S</text><text x="494" y="985">M</text><text x="657" y="985">L</text><text x="820" y="985">XL</text><text x="984" y="985">2XL</text></g>
  <g font-size="27"><text x="78" y="1085" font-weight="800">Width (A)</text><text x="331" y="1085" text-anchor="middle">49 cm</text><text x="494" y="1085" text-anchor="middle">52 cm</text><text x="657" y="1085" text-anchor="middle">55 cm</text><text x="820" y="1085" text-anchor="middle">58 cm</text><text x="984" y="1085" text-anchor="middle">62 cm</text></g>
  <g font-size="27"><text x="78" y="1192" font-weight="800">Length (B)</text><text x="331" y="1192" text-anchor="middle">69 cm</text><text x="494" y="1192" text-anchor="middle">71 cm</text><text x="657" y="1192" text-anchor="middle">73 cm</text><text x="820" y="1192" text-anchor="middle">75 cm</text><text x="984" y="1192" text-anchor="middle">77 cm</text></g>
  <rect x="54" y="1275" width="1012" height="72" rx="20" fill="#f5f5f5"/><text x="560" y="1320" text-anchor="middle" font-size="24" fill="#666">Measurements may vary by ±1–2 cm.</text>

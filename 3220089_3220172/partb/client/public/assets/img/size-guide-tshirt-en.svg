  <path d="M255 25c7 52 138 52 145 0" fill="none" stroke="#c9c9c9" stroke-width="3"/>
  <line x1="154" y1="275" x2="448" y2="275" stroke="#111" stroke-width="5"/>
  <polygon points="154,275 174,264 174,286" fill="#111"/><polygon points="448,275 428,264 428,286" fill="#111"/>
  <text x="301" y="258" text-anchor="middle" font-family="Arial" font-size="36" font-weight="800">A</text>
  <line x1="185" y1="100" x2="185" y2="547" stroke="#111" stroke-width="5"/>
  <polygon points="185,100 174,120 196,120" fill="#111"/><polygon points="185,547 174,527 196,527" fill="#111"/>
  <text x="205" y="340" font-family="Arial" font-size="36" font-weight="800">B</text>
</g>
<line x1="590" y1="350" x2="590" y2="825" stroke="#d8d8d8" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
  <circle cx="665" cy="455" r="43" fill="#e9e9e9"/><text x="665" y="469" text-anchor="middle" font-size="39" font-weight="800">A</text>
  <text x="730" y="445" font-size="38" font-weight="800">Width (A)</text>
  <text x="730" y="492" font-size="25" fill="#555">Measure across the chest,</text>
  <text x="730" y="527" font-size="25" fill="#555">from one side seam to the other.</text>
  <circle cx="665" cy="650" r="43" fill="#e9e9e9"/><text x="665" y="664" text-anchor="middle" font-size="39" font-weight="800">B</text>
  <text x="730" y="640" font-size="38" font-weight="800">Length (B)</text>
  <text x="730" y="687" font-size="25" fill="#555">Measure from the highest point</text>
  <text x="730" y="722" font-size="25" fill="#555">of the shoulder to the bottom hem.</text>
</g>
<g font-family="Arial, Helvetica, sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" role="img" aria-labelledby="title desc">
<title id="title">SKANARE T-Shirt Size Guide</title>
<desc id="desc">Adult S to 2XL t-shirt width and length measurements.</desc>
<rect width="1120" height="1400" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#090909">

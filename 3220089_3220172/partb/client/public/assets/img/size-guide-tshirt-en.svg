  <text x="560" y="185" text-anchor="middle" font-size="52" font-weight="800">T-Shirt Size Guide</text>
  <text x="560" y="235" text-anchor="middle" font-size="28" fill="#6b6b6b">Find your best fit</text>
</g>
<rect x="54" y="285" width="1012" height="600" rx="28" fill="#f7f7f7"/>
<g transform="translate(85 330)">
